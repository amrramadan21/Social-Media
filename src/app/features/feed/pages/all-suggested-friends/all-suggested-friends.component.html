<div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8 mt-20">
  <button (click)="goBack()" class="mb-6 flex items-center space-x-2 text-sm font-medium text-gray-700 bg-white border border-gray-200 px-4 py-2 rounded-lg hover:bg-gray-50 transition shadow-sm">
    <i class="fa-solid fa-arrow-left"></i>
    <span>Back to feed</span>
  </button>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center space-x-2 text-gray-900 font-bold text-xl">
        <i class="fa-solid fa-user-group text-blue-600"></i>
        <h2>All Suggested Friends</h2>
      </div>
      <span class="bg-gray-100 text-gray-600 text-sm font-bold px-3 py-1 rounded-full">{{ totalUsers || suggestedUsers.length }}</span>
    </div>

    <!-- Search input -->
    <div class="relative mb-8">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <i class="fa-solid fa-search text-gray-400"></i>
      </div>
      <input type="text" class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="Search by name or username...">
    </div>

    <!-- Grid of users -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div *ngFor="let user of suggestedUsers" class="flex flex-col border border-gray-200 rounded-xl p-4 hover:shadow-md hover:border-blue-300 transition bg-white">
        <div class="flex items-center justify-between w-full">
          <div class="flex items-center space-x-4 truncate w-full">
            <img [src]="user.photo || 'https://i.pravatar.cc/150?u=' + user._id" alt="Avatar" class="w-12 h-12 rounded-full object-cover border border-gray-200 shrink-0">
            <div class="truncate flex-1 min-w-0">
              <h4 class="font-bold text-[15px] text-gray-900 truncate">{{ user.name }}</h4>
              <p class="text-[13px] text-gray-500 truncate">@{{ user.username || user.name.toLowerCase().replace(' ', '') }}</p>
            </div>
          </div>
          
          <button 
            (click)="followUser(user)"
            class="shrink-0 ml-3 bg-blue-50 text-blue-600 hover:bg-blue-100 font-semibold px-4 py-2 rounded-lg text-sm transition flex items-center space-x-2">
            <ng-container *ngIf="!user.isLoadingFollow">
              <i class="fa-solid" [ngClass]="user.isFollowed ? 'fa-check' : 'fa-user-plus'"></i>
              <span>{{ user.isFollowed ? 'Following' : 'Follow' }}</span>
            </ng-container>
            <ng-container *ngIf="user.isLoadingFollow">
              <i class="fa-solid fa-spinner fa-spin"></i>
            </ng-container>
          </button>
        </div>
        <div class="mt-3">
          <span class="bg-gray-100 text-gray-600 text-[12px] font-medium px-2.5 py-1 rounded-full truncate inline-block">{{ user.followersCount || 0 }} followers</span>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="suggestedUsers.length === 0 && !isLoading" class="text-center py-12">
      <div class="text-gray-400 mb-4 text-4xl"><i class="fa-solid fa-user-xmark"></i></div>
      <h3 class="text-lg font-bold text-gray-900">No suggestions found</h3>
      <p class="text-gray-500">Check back later for more friends.</p>
    </div>

    <!-- Load more section -->
    <div class="mt-8">
      <button 
        *ngIf="hasMoreUsers"
        (click)="loadUsers()"
        [disabled]="isLoading"
        class="w-full bg-gray-50 hover:bg-gray-100 text-gray-800 font-semibold py-3 rounded-xl border border-gray-200 transition flex justify-center items-center space-x-2">
        <ng-container *ngIf="!isLoading">
          <span>Load more users</span>
        </ng-container>
        <ng-container *ngIf="isLoading">
          <i class="fa-solid fa-spinner fa-spin"></i>
          <span>Loading...</span>
        </ng-container>
      </button>

      <div *ngIf="!hasMoreUsers && suggestedUsers.length > 0" class="text-center text-gray-500 text-sm py-4">
        You've seen all suggestions!
      </div>
    </div>
  </div>
</div>
