<div class="post-card" *ngIf="post">
  <!-- Post Header -->
  <div class="post-header">
    <div class="post-user-info">
      <a [routerLink]="'/profile/' + (post.user._id)">
        <img [src]="post.user.photo || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + post.user.username" 
             alt="Avatar" class="post-avatar">
      </a>
      <div>
        <a [routerLink]="'/profile/' + (post.user._id)" class="post-username">{{ post.user.name }}</a>
        <div class="post-meta">
          <span>@{{ post.user.username }}</span>
          <span class="dot">·</span>
          <span>{{ post.createdAt | timeAgo }}</span>
          <span class="dot">·</span>
          <i class="fa-solid fa-earth-americas"></i>
        </div>
      </div>
    </div>
    
    <!-- Post Menu (Owner Only) -->
    <div class="post-menu-wrapper" *ngIf="isOwner">
      <button class="post-menu-btn" (click)="togglePostMenu()">
        <i class="fa-solid fa-ellipsis"></i>
      </button>
      <div class="post-menu-dropdown" *ngIf="showPostMenu">
        <button class="menu-item" (click)="openEdit()">
          <i class="fa-regular fa-pen-to-square"></i> Edit Post
        </button>
        <button class="menu-item danger" (click)="openDelete()">
          <i class="fa-regular fa-trash-can"></i> Delete Post
        </button>
      </div>
    </div>
    
    <!-- Bookmark button for non-owners too -->
    <button *ngIf="!isOwner" class="bookmark-icon-btn" (click)="toggleBookmark()" [class.bookmarked]="post.bookmarked">
      <i [class]="post.bookmarked ? 'fa-solid fa-bookmark' : 'fa-regular fa-bookmark'"></i>
    </button>
  </div>

  <!-- Post Body -->
  <div class="post-body">
    <p class="post-text" *ngIf="post.body">{{ post.body }}</p>
    <img *ngIf="post.image" [src]="post.image" alt="Post image" class="post-image" loading="lazy">
  </div>

  <!-- Stats Row -->
  <div class="post-stats">
    <div class="stat-item">
      <div class="like-badge">
        <i class="fa-solid fa-thumbs-up"></i>
      </div>
      <span>{{ post.likesCount || 0 }}</span>
    </div>
    <div class="stat-right">
      <span>{{ post.commentsCount || 0 }} comments</span>
      <span>{{ post.sharesCount || 0 }} shares</span>
    </div>
  </div>

  <!-- Divider -->
  <hr class="post-divider">

  <!-- Action Buttons -->
  <div class="post-actions">
    <button class="action-btn" [class.liked]="isLiked" (click)="toggleLike()">
      <i [class]="isLiked ? 'fa-solid fa-thumbs-up' : 'fa-regular fa-thumbs-up'"></i>
      <span>Like</span>
    </button>
    <button class="action-btn" (click)="toggleComments()">
      <i class="fa-regular fa-comment"></i>
      <span>Comment</span>
    </button>
    <button class="action-btn" (click)="sharePost()">
      <i class="fa-solid fa-share"></i>
      <span>Share</span>
    </button>
    <button class="action-btn" [class.bookmarked]="post.bookmarked" (click)="toggleBookmark()" *ngIf="isOwner">
      <i [class]="post.bookmarked ? 'fa-solid fa-bookmark' : 'fa-regular fa-bookmark'"></i>
      <span>Save</span>
    </button>
  </div>

  <!-- Comments Section -->
  <div *ngIf="showComments" class="comments-section">
    <app-add-comment [postId]="post.id || post._id!"></app-add-comment>
    <app-all-comments [postId]="post.id || post._id!"></app-all-comments>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" *ngIf="showEditModal" (click)="showEditModal = false">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Edit Post</h3>
      <button class="modal-close" (click)="showEditModal = false">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="modal-body">
      <textarea [(value)]="editBody" (input)="editBody = $any($event.target).value" 
        placeholder="What's on your mind?" class="edit-textarea"></textarea>
      
      <div class="edit-image-preview" *ngIf="editImagePreview">
        <img [src]="editImagePreview" alt="Preview">
        <button class="remove-preview" (click)="removeEditImage()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
    <div class="modal-footer">
      <label class="upload-btn">
        <i class="fa-regular fa-image"></i> Photo
        <input type="file" accept="image/*" class="hidden" (change)="onEditImageChange($event)">
      </label>
      <button class="submit-edit-btn" (click)="submitEdit()" [disabled]="isEditLoading || (!editBody && !editImagePreview)">
        <i *ngIf="isEditLoading" class="fa-solid fa-spinner fa-spin"></i>
        {{ isEditLoading ? 'Saving...' : 'Save Changes' }}
      </button>
    </div>
  </div>
</div>

<!-- Delete Confirmation -->
<app-confirm-dialog
  [visible]="showDeleteDialog"
  title="Delete Post"
  message="Are you sure you want to delete this post? This action cannot be undone."
  confirmText="Delete"
  type="danger"
  [loading]="isDeleteLoading"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()">
</app-confirm-dialog>
