<div class="add-comment-row">
  <img [src]="userData?.photo || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + (userData?.username || 'user')" 
       alt="User" class="comment-avatar">
  <div class="comment-input-wrapper">
    <div class="comment-input-box">
      <textarea 
        [(ngModel)]="commentContent" 
        [placeholder]="placeholder" 
        class="comment-textarea"
        rows="1" 
        (input)="autoResize($event)"></textarea>
      <div class="comment-input-actions">
        <label class="action-icon">
          <i class="fa-regular fa-image"></i>
          <input type="file" accept="image/*" class="hidden" (change)="onImageChange($event)">
        </label>
        <label class="action-icon">
          <i class="fa-regular fa-face-smile"></i>
        </label>
      </div>
    </div>
    
    <!-- Image Preview -->
    <div class="comment-image-preview" *ngIf="imagePreviewUrl">
      <img [src]="imagePreviewUrl" alt="Preview">
      <button class="remove-preview-btn" (click)="removeImage()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Submit -->
    <div *ngIf="commentContent || imagePreviewUrl" class="comment-submit-row">
      <button class="comment-submit-btn" (click)="submitComment()" [disabled]="isLoading">
        <i *ngIf="isLoading" class="fa-solid fa-spinner fa-spin"></i>
        {{ isLoading ? 'Posting...' : 'Post' }}
      </button>
    </div>
  </div>
</div>
